var state = { i:0, answers:[], structure:null, wantTower:false, wantUsed:false, towerBlocked:false };

function branchOf(){ return (state.answers[0] && state.answers[0][0]===1) ? 'invest' : 'live'; }
function activeQ(){ return [FORK].concat(branchOf()==='invest' ? INVEST_Q : LIVE_Q); }
function ansOf(role){ var qs=activeQ(); for(var i=0;i<qs.length;i++){ if(qs[i].role===role) return state.answers[i]||[]; } return []; }
function budgetIdxOf(){ var a=ansOf('budget'); return a.length?a[0]:undefined; }
function flagPicked(flag){ var qs=activeQ(); for(var i=0;i<qs.length;i++){ var a=state.answers[i]; if(!a)continue; for(var j=0;j<a.length;j++){ var o=qs[i].opts[a[j]]; if(o&&o[flag]) return true; } } return false; }
function txtOf(role){ var qs=activeQ(); for(var i=0;i<qs.length;i++){ if(qs[i].role===role){ var a=state.answers[i]||[]; return a.map(function(x){ return qs[i].opts[x].t.split(' —')[0]; }).join('、'); } } return ''; }

function start(){
  state = { i:0, answers:[], structure:null, wantTower:false, wantUsed:false, towerBlocked:false };
  document.getElementById('intro').style.display='none';
  document.getElementById('resultHost').style.display='none';
  document.getElementById('quiz').style.display='block';
  if(window.gtag)gtag('event','quiz_start',{page:location.pathname});
  render();
}

function render(){
  var qs = activeQ(), Q = qs[state.i], total = qs.length;
  if(!state.answers[state.i]) state.answers[state.i]=[];
  document.getElementById('pfill').style.width = ((state.i)/total*100)+'%';
  document.getElementById('pnum').textContent = '第 '+(state.i+1)+' / '+total+' 题';
  var sel = state.answers[state.i];
  var h = '<div class="card">';
  h += '<div class="q-no">Q'+(state.i+1)+'</div>';
  h += '<div class="q-title">'+Q.q+'</div>';
  h += '<div class="q-hint">'+Q.hint+'</div>';
  h += Q.multi ? '<span class="multi-tag">✔ 可复选</span>' : '<span class="multi-tag single">◉ 单选题</span>';
  h += '<div class="opts">';
  Q.opts.forEach(function(o,idx){
    var on = sel.indexOf(idx)>=0;
    h += '<button class="opt'+(on?' sel':'')+'" onclick="tap('+idx+')"><span class="ic">'+o.ic+'</span><span>'+o.t+'</span>'+(Q.multi?'<span class="ck">'+(on?'✓':'')+'</span>':'')+'</button>';
  });
  h += '</div>';
  h += '<div class="q-actions">';
  h += '<button class="prev" onclick="back()">'+(state.i>0?'← 上一题':'')+'</button>';
  if(Q.multi){
    var last = (state.i===total-1);
    h += '<button class="next" onclick="nextQ()"'+(sel.length?'':' disabled')+'>'+(last?'看结果 →':'下一题 →')+'</button>';
  }
  h += '</div></div>';
  document.getElementById('qhost').innerHTML = h;
  window.scrollTo({top:0,behavior:'smooth'});
}

function tap(idx){
  var qs = activeQ(), Q = qs[state.i];
  if(!state.answers[state.i]) state.answers[state.i]=[];
  var sel = state.answers[state.i];
  if(Q.multi){
    var p = sel.indexOf(idx);
    if(p>=0) sel.splice(p,1); else sel.push(idx);
    render();
  } else {
    state.answers[state.i] = [idx];
    if(state.i===0) state.answers.length = 1;   // 改「方向」时，清掉后面旧答案
    advance();
  }
}
function nextQ(){ if(state.answers[state.i] && state.answers[state.i].length) advance(); }
function advance(){ if(state.i < activeQ().length-1){ state.i++; render(); } else finish(); }
function back(){ if(state.i>0){ state.i--; render(); } }

function finish(){
  var branch = branchOf();
  var keys = (branch==='invest') ? INVEST_KEYS : LIVE_KEYS;
  var qs = activeQ();
  var score = {}; keys.forEach(function(k){ score[k]=0; });
  state.wantTower=false; state.wantUsed=false; state.towerBlocked=false; state.structure=null;
  state.answers.forEach(function(sel,qi){
    if(!sel || qi>=qs.length) return;
    sel.forEach(function(idx){
      var o = qs[qi].opts[idx]; if(!o) return;
      if(o.tower) state.wantTower = true;
      if(o.used) state.wantUsed = true;
      var add = o.add || {};
      Object.keys(add).forEach(function(k){ if(k in score) score[k]+=add[k]; });
    });
  });

  if(branch==='live'){
    // 不跟邻居共墙 → 一定不是公寓/塔楼（共墙建物），只留一户建/注文宅
    if(flagPicked('nowall')){ score.mansion_new=0; score.mansion_used=0; score.tower=0; }

    var bIdx = budgetIdxOf();
    if((bIdx===undefined || bIdx<4) && score.tower>0){  // 塔楼需 1 亿以上（第 5 档起）
      score.mansion_new += score.tower; score.tower = 0;
      if(state.wantTower) state.towerBlocked = true;
    }
  }

  var ranked = keys.slice().sort(function(a,b){ return score[b]-score[a]; });
  var top = ranked[0], topScore = score[top]||0;
  var also = ranked.slice(1).filter(function(k){ return score[k]>0 && score[k] >= topScore*0.7; }).slice(0,2);
  var closeCount = ranked.filter(function(k){ return score[k]>0 && score[k] >= topScore*0.85; }).length;
  var strict = (branch==='live') && (flagPicked('picky') || closeCount>=4);

  // 推导木造 / RC（只对自住的透天类；公寓塔楼固定 RC，注文宅自由）
  if(branch==='live'){
    if(top==='chumon') state.structure = 'ask';
    else if(top==='shinchiku_kodate' || top==='chuko_kodate') state.structure = flagPicked('soundproof') ? 'rc' : 'wood';
  }
  showResult(branch, top, also, strict, score, ranked);
}

function structLabel(){
  if(state.structure==='rc') return {t:"建议偏 RC（钢筋混凝土）", why:"你最受不了听到邻居的声音，RC 造隔音好、耐震也稳，适合你。"};
  if(state.structure==='wood') return {t:"木造也很适合你", why:"日本木造工法成熟、造价亲民、冬暖，透天用木造很常见也划算。"};
  return {t:"木造 / RC 由周周依情况建议", why:"注文宅木造或 RC 都能盖，可以看你的预算、需求，周周再帮你分析。"};
}

function recapHTML(branch){
  var dims = ['购屋方向'].concat(branch==='invest' ? DIMS_INVEST : DIMS_LIVE);
  var qs = activeQ(), rows = '';
  state.answers.forEach(function(sel,qi){
    if(!sel || !sel.length || qi>=qs.length) return;
    var txt = sel.map(function(idx){ return qs[qi].opts[idx] ? qs[qi].opts[idx].t : ''; }).filter(Boolean).join('、');
    if(!txt) return;
    rows += '<div class="an-row"><span class="dim">'+(dims[qi]||'')+'</span><span class="val">'+txt+'</span></div>';
  });
  return rows;
}

function barsHTML(score, ranked){
  var topScore = score[ranked[0]] || 1;
  var list = ranked.filter(function(k){ return score[k]>0; }).slice(0,5);
  var h = '<div class="bars"><div class="bt">📊 各方向契合度</div>';
  list.forEach(function(k,i){
    var pct = Math.round(score[k]/topScore*100);
    h += '<div class="bar-row"><span class="bar-name">'+RESULTS[k].short+'</span><span class="bar-track"><span class="bar-fill'+(i===0?'':' dim')+'" style="width:'+pct+'%"></span></span><span class="bar-pct">'+pct+'%</span></div>';
  });
  h += '</div>';
  return h;
}

function whyHTML(branch, top){
  if(branch==='invest'){
    var want = txtOf('igoal'), bud = txtOf('budget');
    var s = '你选择<b>投资</b>方向';
    if(want) s += '、最想要<b>'+want+'</b>';
    if(bud) s += '、预算<b>'+bud+'</b>';
    s += '。'+RESULTS[top].fit+' 综合起来，最适合你的是 <b>'+RESULTS[top].name+'</b>。';
    return s;
  }
  var life = txtOf('life'), bud2 = txtOf('budget'), place = txtOf('place');
  var s2 = '你选择<b>自住</b>方向';
  if(life) s2 += '、向往<b>'+life+'</b>';
  if(bud2) s2 += '、预算<b>'+bud2+'</b>';
  if(place) s2 += '、地点<b>'+place+'</b>';
  s2 += '。'+RESULTS[top].fit+' 综合起来，最贴近你的是 <b>'+RESULTS[top].name+'</b>。';
  return s2;
}

  return '<div class="reality"><p><b>'+head+'</b>'+body+'</p><p class="cta-line"><b>想知道你的预算实际适合什么？直接私讯周周，我帮你评估！</b></p></div>';
}

function budgetNote(branch, top){
  if(branch==='invest'){
    var ib = budgetIdxOf();
    if(ib===undefined) return '';
    if(top==='invest_hotel' && ib<3)
      return ctaBox('🏨 关于民宿/旅馆预算：','民宿／旅馆基本上要买<b>一整栋</b>，物件<b>大约 7,000 万日圆起跳</b>，你目前设定的预算可能还不太够，且经营风险比一般租赁高。可以先从住宅租赁或商用起步。');
    if(top==='invest_ittou' && ib<4)
      return ctaBox('🏗️ 关于整栋预算：','整栋收购通常<b>破亿日圆</b>起跳，你目前设定的预算可能还不太够。可以先从区分（一间）或商用物件起步，慢慢往整栋走。');
    return '';
  }
  var bi = budgetIdxOf();
  if(bi===undefined) return '';
  if(top==='chumon'){
    if(bi>2) return '';
    return ctaBox('🏗️ 关于注文宅预算：','注文宅是「买地＋盖房」，土地加建筑成本，总预算通常偏高。用你目前的预算会比较吃紧，建议先跟周周聊聊地点与预算怎么配置。');
  }
  var wantsNew = ['shinchiku_kodate','mansion_new','tower'].indexOf(top)>=0 || flagPicked('newish');
  var msg='', retake=false;
  if(bi===0){ msg='老实说，用这个预算在东京都内几乎碰不到新屋——多半是屋龄较高的中古小宅，或要往比较远的郊区、甚至东京都以外才有机会。如果你想要新一点、地点又方便的房子，建议把预算或条件再放宽一点喔。'; retake=true; }
  else if(bi===1){ msg='跟你说个实话，用这个预算在东京主要贩售区域通常还是以中古为主，全新的选择很少。想要又新、地点又好，多半得再往上抓一点预算，或先从中古入手。'; }
  else if(bi===2 && wantsNew){ msg='偷偷跟你说，想在这些精华地段、用这个预算买到「全新」，其实不太容易哦😅（你的标准有一点点高～）。同样的预算换成中古、或稍微外围一点，选择会多很多。'; }
  else return '';
  var h = '<div class="reality"><p><b>🏷️ 关于预算：</b>'+msg+'</p>';
  h += '<p class="cta-line"><b>想知道你的预算实际能买到什么样的房子？直接私讯周周，我帮你抓真实行情！</b></p>';
  if(retake) h += '<button class="re-btn" onclick="start()">↺ 放宽条件，再测一次</button>';
  h += '</div>';
  return h;
}

function showResult(branch, top, also, strict, score, ranked){
  var R = RESULTS[top];
  var st = structLabel();
  var host = document.getElementById('resultHost');
  document.getElementById('quiz').style.display='none';
  document.getElementById('pfill').style.width='100%';
  if(window.gtag)gtag('event','quiz_complete',{branch:branch,persona:top,persona_name:(PERSONA[top]&&PERSONA[top].type)||R.name});

  var isHouse = (top==='shinchiku_kodate'||top==='chuko_kodate'||top==='chumon');
  var isMansion = (top==='mansion_new'||top==='mansion_used'||top==='tower');

  var P = PERSONA[top] || {emoji:"🏠",type:R.name,keys:R.tags,desc:R.fit};

  lastTop = top;
  var pim = PERSONA_IMG[top] ? PERSONA_IMG[top][G] : R.img;

  var h = '<div class="result">';
  h += '<div class="r-lead"><span class="k">✨ 测验结果揭晓</span></div>';
  if(PERSONA_IMG[top]){
    h += '<div class="gender-tog"><button class="gt'+(G==='f'?' on':'')+'" data-g="f" onclick="setGender(\'f\')">👧 女生版</button><button class="gt'+(G==='m'?' on':'')+'" data-g="m" onclick="setGender(\'m\')">👦 男生版</button></div>';
  }
  h += '<img id="pcardImg" class="pcard-full" src="'+pim+'" alt="'+P.type+'・买房人格卡">';
  h += '<button type="button" class="share-btn" onclick="shareQuiz()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5 15.4 6.5M8.6 13.5 15.4 17.5"/></svg>分享测验给朋友</button>';
  h += '<p class="pcard-share">切换男生／女生版本，长按或截图存下你的买房人格卡分享 ✨</p>';
  if(isHouse) h += '<p class="pcard-note">🧱 '+st.why+'</p>';
  if(top==='tower' && state.wantUsed) h += '<p class="pcard-note">✨ 你偏好中古 → 同地段的<b>中古塔楼</b>通常比全新划算，周周可以帮你比。</p>';

  if(branch==='live' && state.towerBlocked){
    h += '<div class="reality"><p><b>🏙️ 关于塔楼：</b>你向往高楼层的塔楼生活，不过塔楼在东京多半要 <b>1 亿日圆以上</b>的预算才比较买得到。以你目前设定的预算，会建议先从<b>全新／大型公寓大楼</b>入手，一样有管理员、机能好、又保值。</p><p class="cta-line"><b>如果真的很想要塔楼，也可以私讯周周，我帮你看看有没有适合的中古塔楼或方案！</b></p></div>';
  }

  h += budgetNote(branch, top);

  /* ---- 专属类型详细说明（测出来直接跳出） ---- */
  h += typeDetailHTML(top);

  /* ---- 分析 ---- */
  h += '<div class="an">';
  h += '<h3>🔍 周周的分析</h3>';
  h += '<div class="sub">根据你的选择，帮你推导出方向</div>';
  h += barsHTML(score, ranked);
  h += '<div class="an-why">'+whyHTML(branch, top)+'</div>';
  h += '<div class="an-recap">'+recapHTML(branch)+'</div>';
  h += '</div>';

  h += '<div class="r-note"><p><b>💡 周周的提醒：</b>'+R.note+'</p></div>';

  if(also.length){
    h += '<div class="r-also"><div class="h">你其实也蛮适合这些方向 👇</div>';
    also.forEach(function(k){
      var A = RESULTS[k];
      var athumb = PERSONA_IMG[k] ? PERSONA_IMG[k][G] : (A.img || pim);
      h += '<div class="mini"><img class="mini-thumb" data-key="'+k+'" src="'+athumb+'" alt="'+A.name+'・人格卡"><div><b>'+A.name+'</b><p>'+A.tags.join('・')+'</p></div></div>';
    });
    h += '</div>';
  }

  if(strict && top!=='chumon'){
    h += '<div class="strict"><p><b>🎨 想得很细、每种都有坚持？</b>你的答案分布蛮分散、对细节也很有想法——这种情况，市售现成的房子可能都会差你一点。真的很讲究的话，可以考虑<b>注文宅（买地自己设计）</b>，盖一间完全照你想法的房子；不过要提醒你，注文宅比较花心力、预算通常也会高一些喔。要不要走这条路，周周可以帮你评估预算再决定。</p></div>';
  }

  h += '<div class="cta">';
  h += '<a class="line" href="https://lin.ee/RscRWCp" target="_blank" rel="noopener">💬 加 LINE 问周周这个方向</a>';
  h += '<button class="re" onclick="start()">↺ 重新测一次</button>';
  h += '</div>';

  h += '<p class="disc">＊本测验仅为协助厘清方向的趣味参考，非投资或购屋建议。实际适合的房型、贷款成数、投报率与税务等，仍需依个案评估，并由宅建士／司法书士／税理士确认为准。</p>';
  h += '</div>';

  host.innerHTML = h;
  host.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
